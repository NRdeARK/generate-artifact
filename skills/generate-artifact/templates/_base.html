<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
{{theme_css}}
{{base_css}}
</style>
<script>{{base_js}}</script>
</head>
<body class="{{body_class}}">
<header class="top">
  <div class="brand"><strong class="project">{{project}}</strong><span class="pill">{{page_label}}</span>{{header_extra}}</div>
  <nav class="nav">{{nav}}</nav>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-set-lang="en">EN</button><button type="button" data-set-lang="th">TH</button></div>
</header>
<main>
{{content}}
</main>
<footer>{{ui:footer.updated}} {{updated}}</footer>
</body>
</html>
