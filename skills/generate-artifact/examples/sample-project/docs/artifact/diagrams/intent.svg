<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 488" width="1320" height="488" role="img" aria-labelledby="intent-title intent-desc">
<title id="intent-title">Intent swimlane: who is involved</title>
<desc id="intent-desc">Swimlane overview of Status Board: a project lead&#x27;s update travels through the Web app, API, Event queue and Aggregator into the Projects DB, then reaches everyone within ten seconds.</desc>
