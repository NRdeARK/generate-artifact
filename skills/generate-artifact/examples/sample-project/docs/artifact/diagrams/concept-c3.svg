<svg xmlns="http://www.w3.org/2000/svg" id="concept-c3" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="concept-c3-title concept-c3-desc">
<title id="concept-c3-title">C3 Status history, no overwrite</title>
<desc id="concept-c3-desc">Concept diagram: a status update still refreshes the latest status in the Projects DB and now also appends a row to the status history table.</desc>
<defs><marker id="concept-c3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker><marker id="concept-c3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker><marker id="concept-c3-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="concept-c3-arrow-changed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B87800"/></marker><marker id="concept-c3-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="concept-c3-arrow-removed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5A5A"/></marker></defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="28" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.1em">C3 · STATUS HISTORY</text>
<rect x="372" y="64" width="580" height="190" rx="6" fill="none" stroke="rgba(20,20,19,0.28)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="388" y="86" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">PROJECTS DB</text>
<line x1="160" y1="160" x2="379" y2="160" stroke="#5E5D59" stroke-width="1.6" marker-end="url(#concept-c3-arrow)"/>
<rect x="213" y="136" width="113" height="16" rx="2" fill="#FAF9F5"/><text x="270" y="148" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS UPDATE</text>
<path d="M550 160 H570 V128 H600 M570 160 V196 H600" fill="none" stroke="#5E5D59" stroke-width="1.6"/>
<line x1="600" y1="128" x2="689" y2="128" stroke="#5E5D59" stroke-width="1.6" marker-end="url(#concept-c3-arrow)"/>
<line x1="600" y1="196" x2="689" y2="196" stroke="#D97757" stroke-width="2.0" marker-end="url(#concept-c3-arrow-accent)"/>
<rect x="615" y="104" width="61" height="16" rx="2" fill="#FAF9F5"/><text x="645" y="116" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>
<rect x="600" y="172" width="91" height="16" rx="2" fill="#FAF9F5"/><text x="645" y="184" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">APPEND ROW</text>
<rect x="40" y="132" width="120" height="56" rx="6" fill="#FAF9F5"/><rect x="40" y="132" width="120" height="56" rx="6" fill="#FFFFFF" stroke="#8A8880" stroke-width="1"/><text x="100.0" y="165.0" fill="#141413" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Status update</text>
<rect x="380" y="132" width="170" height="56" rx="6" fill="#FAF9F5"/><rect x="380" y="132" width="170" height="56" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="465.0" y="158.0" fill="#5C3A00" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">projects</text><text x="465.0" y="176.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">latest status</text>
<rect x="690" y="100" width="240" height="56" rx="6" fill="#FAF9F5"/><rect x="690" y="100" width="240" height="56" rx="6" fill="#EFEDE6" stroke="#B0AEA5" stroke-width="1"/><text x="810.0" y="126.0" fill="#3D3D3A" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">projects.status</text><text x="810.0" y="144.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">overwritten as before</text>
<rect x="690" y="168" width="240" height="56" rx="6" fill="#FAF9F5"/><rect x="690" y="168" width="240" height="56" rx="6" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1"/><text x="810.0" y="194.0" fill="#0B3D63" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">status_history</text><text x="810.0" y="212.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">new: one row per update</text>
<text x="40" y="292" fill="#5E5D59" font-size="16" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" text-anchor="start" font-style="italic">Before, an update overwrote the old value. Now it also adds a history row.</text>
<line x1="24" y1="288" x2="976" y2="288" stroke="rgba(20,20,19,0.10)" stroke-width="1"/><text x="24" y="311" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">LEGEND</text><rect x="112" y="300" width="20" height="14" rx="2" fill="#FFFFFF" stroke="#8A8880"/><text x="140" y="311" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">actor</text><rect x="202.1" y="300" width="20" height="14" rx="2" fill="#FBE3B0" stroke="#B87800"/><text x="230.1" y="311" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">changed</text><rect x="305.84000000000003" y="300" width="20" height="14" rx="2" fill="#CFE4F5" stroke="#1F6FA8"/><text x="333.84000000000003" y="311" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">new</text><line x1="382.3" y1="307" x2="410.3" y2="307" stroke="#D97757" stroke-width="1.6"/><text x="418.3" y="311" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">new behavior</text>
</svg>
