<svg xmlns="http://www.w3.org/2000/svg" id="queue-topology" viewBox="0 0 1160 380" width="1160" height="380" role="img" aria-labelledby="queue-topology-title queue-topology-desc">
<title id="queue-topology-title">Event queue topology</title>
<desc id="queue-topology-desc">Topology of the Event queue: the API publishes status events, the Aggregator consumes them, and events that fail three times move to a new dead-letter queue.</desc>
<defs><marker id="queue-topology-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker><marker id="queue-topology-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker><marker id="queue-topology-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="queue-topology-arrow-changed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B87800"/></marker><marker id="queue-topology-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="queue-topology-arrow-removed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5A5A"/></marker></defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="28" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.1em">COMPONENT · EVENT QUEUE · TOPOLOGY</text>
<line x1="216" y1="120" x2="369" y2="120" stroke="#B87800" stroke-width="2.2" marker-end="url(#queue-topology-arrow-changed)"/>
<rect x="259" y="96" width="68" height="16" rx="2" fill="#FAF9F5"/><text x="293" y="108" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text>
<line x1="586" y1="120" x2="739" y2="120" stroke="#1F6FA8" stroke-width="2.2" marker-end="url(#queue-topology-arrow-new)"/>
<rect x="629" y="96" width="68" height="16" rx="2" fill="#FAF9F5"/><text x="663" y="108" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DELIVER</text>
<path d="M478 150 V226" fill="none" stroke="#1F6FA8" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#queue-topology-arrow-new)"/>
<rect x="486" y="180" width="166" height="16" rx="2" fill="#FAF9F5"/><text x="494" y="192" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.06em">AFTER 3 FAILED TRIES</text>
<rect x="40" y="90" width="176" height="60" rx="6" fill="#FAF9F5"/><rect x="40" y="90" width="176" height="60" rx="6" fill="#EFEDE6" stroke="#B0AEA5" stroke-width="1"/><text x="128.0" y="118.0" fill="#3D3D3A" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">API</text><text x="128.0" y="136.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">producer</text>
<rect x="370" y="90" width="216" height="60" rx="6" fill="#FAF9F5"/><rect x="370" y="90" width="216" height="60" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="478.0" y="118.0" fill="#5C3A00" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Event queue</text><text x="478.0" y="136.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">status-events, payload v2</text>
<rect x="740" y="90" width="176" height="60" rx="6" fill="#FAF9F5"/><rect x="740" y="90" width="176" height="60" rx="6" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1"/><text x="828.0" y="118.0" fill="#0B3D63" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Aggregator</text><text x="828.0" y="136.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">consumer</text>
<rect x="370" y="230" width="216" height="60" rx="6" fill="#FAF9F5"/><rect x="370" y="230" width="216" height="60" rx="6" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1"/><text x="478.0" y="258.0" fill="#0B3D63" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Dead-letter queue</text><text x="478.0" y="276.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">status-events-dlq</text>
<line x1="24" y1="328" x2="1136" y2="328" stroke="rgba(20,20,19,0.10)" stroke-width="1"/><text x="24" y="351" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">LEGEND</text><rect x="112" y="340" width="20" height="14" rx="2" fill="#EFEDE6" stroke="#B0AEA5"/><text x="140" y="351" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">unchanged</text><rect x="229.38" y="340" width="20" height="14" rx="2" fill="#FBE3B0" stroke="#B87800"/><text x="257.38" y="351" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">changed</text><rect x="333.12" y="340" width="20" height="14" rx="2" fill="#CFE4F5" stroke="#1F6FA8"/><text x="361.12" y="351" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">new</text>
</svg>
