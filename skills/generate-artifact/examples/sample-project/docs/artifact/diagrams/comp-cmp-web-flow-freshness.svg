<svg xmlns="http://www.w3.org/2000/svg" id="flow-freshness" viewBox="0 0 1000 740" width="1000" height="740" role="img" aria-labelledby="flow-freshness-title flow-freshness-desc">
<title id="flow-freshness-title">Freshness label: how the Web app decides what to show</title>
<desc id="flow-freshness-desc">Flowchart of the Web app&#x27;s freshness label: a failed fetch shows a retry message; otherwise status updated under ten seconds ago shows a normal label, under an hour an amber label, and older shows a stale banner with retry.</desc>
<defs><marker id="flow-freshness-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker><marker id="flow-freshness-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker><marker id="flow-freshness-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="flow-freshness-arrow-changed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B87800"/></marker><marker id="flow-freshness-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="flow-freshness-arrow-removed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5A5A"/></marker></defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="28" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.1em">COMPONENT · WEB APP · LOGIC FLOW</text>
<path d="M240 88 V132" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#flow-freshness-arrow)"/>
<path d="M240 232 V288" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#flow-freshness-arrow)"/>
<rect x="248" y="252" width="38" height="16" rx="2" fill="#FAF9F5"/><text x="256" y="264" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.06em">YES</text>
<path d="M240 388 V444" fill="none" stroke="#5E5D59" stroke-width="1.4" marker-end="url(#flow-freshness-arrow)"/>
<rect x="248" y="408" width="31" height="16" rx="2" fill="#FAF9F5"/><text x="256" y="420" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.06em">NO</text>
<path d="M240 544 V600" fill="none" stroke="#1F6FA8" stroke-width="2.2" marker-end="url(#flow-freshness-arrow-new)"/>
<rect x="248" y="564" width="31" height="16" rx="2" fill="#FAF9F5"/><text x="256" y="576" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.06em">NO</text>
<line x1="370" y1="182" x2="549" y2="182" stroke="#1F6FA8" stroke-width="2.2" marker-end="url(#flow-freshness-arrow-new)"/>
<rect x="445" y="158" width="31" height="16" rx="2" fill="#FAF9F5"/><text x="460.0" y="170" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
<line x1="370" y1="338" x2="549" y2="338" stroke="#5E5D59" stroke-width="1.6" marker-end="url(#flow-freshness-arrow)"/>
<rect x="441" y="314" width="38" height="16" rx="2" fill="#FAF9F5"/><text x="460.0" y="326" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<line x1="370" y1="494" x2="549" y2="494" stroke="#B87800" stroke-width="2.2" marker-end="url(#flow-freshness-arrow-changed)"/>
<rect x="441" y="470" width="38" height="16" rx="2" fill="#FAF9F5"/><text x="460.0" y="482" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
<rect x="130" y="44" width="220" height="44" rx="22" fill="#FAF9F5"/><rect x="130" y="44" width="220" height="44" rx="22" fill="#141413" stroke="#141413" stroke-width="1.4"/><text x="240" y="71.0" fill="#FAF9F5" font-size="14" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Status page loads</text>
<polygon points="240,132 370,182 240,232 110,182" fill="#FAF9F5"/><polygon points="240,132 370,182 240,232 110,182" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/><text x="240" y="187.0" fill="#0B3D63" font-size="13" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Fetch OK?</text>
<polygon points="240,288 370,338 240,388 110,338" fill="#FAF9F5"/><polygon points="240,288 370,338 240,388 110,338" fill="#EFEDE6" stroke="#B0AEA5" stroke-width="1.4"/><text x="240" y="335.0" fill="#3D3D3A" font-size="13" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Updated</text><text x="240" y="352.0" fill="#3D3D3A" font-size="13" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">&lt; 10 s ago?</text>
<polygon points="240,444 370,494 240,544 110,494" fill="#FAF9F5"/><polygon points="240,444 370,494 240,544 110,494" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/><text x="240" y="491.0" fill="#0B3D63" font-size="13" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Updated</text><text x="240" y="508.0" fill="#0B3D63" font-size="13" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">&lt; 1 h ago?</text>
<rect x="550" y="152" width="300" height="60" rx="30" fill="#FAF9F5"/><rect x="550" y="152" width="300" height="60" rx="30" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/><text x="700" y="181.0" fill="#0B3D63" font-size="14" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Retry message</text><text x="700" y="197.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">Couldn&#x27;t load status. Retry</text>
<rect x="550" y="308" width="300" height="60" rx="30" fill="#FAF9F5"/><rect x="550" y="308" width="300" height="60" rx="30" fill="#EFEDE6" stroke="#B0AEA5" stroke-width="1.4"/><text x="700" y="337.0" fill="#3D3D3A" font-size="14" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Updated N s ago</text><text x="700" y="353.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">normal label</text>
<rect x="550" y="464" width="300" height="60" rx="30" fill="#FAF9F5"/><rect x="550" y="464" width="300" height="60" rx="30" fill="#FBE3B0" stroke="#B87800" stroke-width="1.4"/><text x="700" y="493.0" fill="#5C3A00" font-size="14" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Updated N min ago</text><text x="700" y="509.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">amber label</text>
<rect x="60" y="600" width="360" height="60" rx="30" fill="#FAF9F5"/><rect x="60" y="600" width="360" height="60" rx="30" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1.4"/><text x="240" y="629.0" fill="#0B3D63" font-size="14" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" font-weight="600">Stale banner + retry</text><text x="240" y="645.0" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">Status may be out of date</text>
<line x1="24" y1="688" x2="976" y2="688" stroke="rgba(20,20,19,0.10)" stroke-width="1"/><text x="24" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">LEGEND</text><rect x="112" y="700" width="20" height="14" rx="2" fill="#141413" stroke="#141413"/><text x="140" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">start</text><rect x="202.1" y="700" width="20" height="14" rx="2" fill="#EFEDE6" stroke="#B0AEA5"/><text x="230.1" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">unchanged</text><rect x="319.48" y="700" width="20" height="14" rx="2" fill="#FBE3B0" stroke="#B87800"/><text x="347.48" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">changed</text><rect x="423.22" y="700" width="20" height="14" rx="2" fill="#CFE4F5" stroke="#1F6FA8"/><text x="451.22" y="711" fill="#5E5D59" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">new</text>
