<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="concept-c2-title concept-c2-desc">
<title id="concept-c2-title">C2 Aggregator</title>
<desc id="concept-c2-desc">Concept diagram: the Aggregator reads events from the Event queue and writes the latest status and history to the Projects DB, while the API serves pages.</desc>
