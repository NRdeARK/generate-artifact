<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img" aria-labelledby="concept-c1-title concept-c1-desc">
<title id="concept-c1-title">C1 Event-driven status</title>
<desc id="concept-c1-desc">Concept diagram: a status change leaves the Web app as an event, passes through the Event queue and Aggregator, and lands in the Projects DB within seconds.</desc>
<defs><marker id="concept-c1-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker><marker id="concept-c1-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker><marker id="concept-c1-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="concept-c1-arrow-changed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#B87800"/></marker><marker id="concept-c1-arrow-new" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker><marker id="concept-c1-arrow-removed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8A5A5A"/></marker></defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="24" fill="#5E5D59" font-size="9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">C1 · EVENT-DRIVEN STATUS</text>
<line x1="150" y1="112" x2="269" y2="112" stroke="#D97757" stroke-width="1.2" marker-end="url(#concept-c1-arrow-accent)"/>
<rect x="174" y="91" width="72" height="12" rx="2" fill="#FAF9F5"/><text x="210.0" y="100" fill="#8A8880" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS EVENT</text>
<line x1="380" y1="112" x2="499" y2="112" stroke="#5E5D59" stroke-width="1.2" marker-end="url(#concept-c1-arrow)"/>
<rect x="417" y="91" width="47" height="12" rx="2" fill="#FAF9F5"/><text x="440.0" y="100" fill="#8A8880" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">DELIVER</text>
<line x1="610" y1="112" x2="729" y2="112" stroke="#5E5D59" stroke-width="1.2" marker-end="url(#concept-c1-arrow)"/>
<rect x="652" y="91" width="37" height="12" rx="2" fill="#FAF9F5"/><text x="670.0" y="100" fill="#8A8880" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
<rect x="40" y="92" width="110" height="40" rx="6" fill="#FAF9F5"/><rect x="40" y="92" width="110" height="40" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="95.0" y="116.0" fill="#5C3A00" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Web app</text>
<rect x="270" y="92" width="110" height="40" rx="6" fill="#FAF9F5"/><rect x="270" y="92" width="110" height="40" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="325.0" y="116.0" fill="#5C3A00" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Event queue</text>
<rect x="500" y="92" width="110" height="40" rx="6" fill="#FAF9F5"/><rect x="500" y="92" width="110" height="40" rx="6" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1"/><text x="555.0" y="116.0" fill="#0B3D63" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Aggregator</text>
<rect x="730" y="92" width="110" height="40" rx="6" fill="#FAF9F5"/><rect x="730" y="92" width="110" height="40" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="785.0" y="116.0" fill="#5C3A00" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Projects DB</text>
