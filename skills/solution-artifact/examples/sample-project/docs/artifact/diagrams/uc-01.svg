<title id="uc-01-title">UC-01 view project status: sequence with bad paths and edge cases</title>
<desc id="uc-01-desc">Sequence of a team member opening the status page; the API reads the latest status from the Projects DB. Alt fragments show an API timeout, a database error, zero projects and more than 500 projects.</desc>
