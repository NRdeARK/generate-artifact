<rect x="733" y="96" width="53" height="16" rx="2" fill="#FAF9F5"/><text x="760.0" y="108" fill="#6F6D66" font-size="11" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
<rect x="40" y="92" width="140" height="56" rx="6" fill="#FAF9F5"/><rect x="40" y="92" width="140" height="56" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="110.0" y="125.0" fill="#5C3A00" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Web app</text>
<rect x="300" y="92" width="140" height="56" rx="6" fill="#FAF9F5"/><rect x="300" y="92" width="140" height="56" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="370.0" y="125.0" fill="#5C3A00" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Event queue</text>
<rect x="560" y="92" width="140" height="56" rx="6" fill="#FAF9F5"/><rect x="560" y="92" width="140" height="56" rx="6" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1"/><text x="630.0" y="125.0" fill="#0B3D63" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Aggregator</text>
<rect x="820" y="92" width="140" height="56" rx="6" fill="#FAF9F5"/><rect x="820" y="92" width="140" height="56" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="890.0" y="125.0" fill="#5C3A00" font-size="14" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Projects DB</text>
