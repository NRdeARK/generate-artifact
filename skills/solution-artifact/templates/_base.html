<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>
{{theme_css}}
{{base_css}}
</style>
<script>{{base_js}}</script>
</head>
<body class="{{body_class}}">
<header class="top">
  <div class="brand"><strong class="project">{{project}}</strong><span class="pill">{{page_label}}</span>{{header_extra}}</div>
  <nav class="nav" aria-label="Artifact tabs"><div class="nav-group">{{nav_intent}}</div><span class="nav-divider" aria-hidden="true"></span><div class="nav-group"><span class="nav-group-label">{{ui:page.solution}}</span>{{nav_solution}}</div></nav>
  <div class="lang" role="group" aria-label="Language"><button type="button" data-set-lang="en">EN</button><button type="button" data-set-lang="th">TH</button></div>
</header>
<main>
{{content}}
</main>
<footer>{{ui:footer.updated}} {{updated}}</footer>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewer-caption" hidden>
  <div class="viewer-bar">
    <span class="viewer-caption" id="viewer-caption"></span>
    <span class="viewer-legend" id="viewer-legend" hidden></span>
    <div class="viewer-tools">
      <span class="layout-seg" role="group" aria-label="{{label_layout}}" hidden><button type="button" data-viewer="layout-side" aria-pressed="false" aria-label="{{label_layout_side}}">{{ui:viewer.layout_side}}</button><button type="button" data-viewer="layout-stack" aria-pressed="false" aria-label="{{label_layout_stack}}">{{ui:viewer.layout_stack}}</button></span>
      <button type="button" data-viewer="sync-zoom" aria-pressed="false" aria-label="{{label_sync_zoom}}" hidden>{{ui:viewer.sync_zoom}}</button>
      <button type="button" data-viewer="sync-pan" aria-pressed="false" aria-label="{{label_sync_pan}}" hidden>{{ui:viewer.sync_pan}}</button>
      <button type="button" data-viewer="out" aria-label="{{label_zoom_out}}">&minus;</button>
      <button type="button" data-viewer="reset" aria-label="{{label_fit}}">{{ui:viewer.fit}}</button>
      <button type="button" data-viewer="in" aria-label="{{label_zoom_in}}">+</button>
      <button type="button" data-viewer="close" aria-label="{{label_close}}">&times;</button>
    </div>
  </div>
  <div class="viewer-panes">
    <div class="viewer-pane" data-pane="0"><span class="pane-label" hidden></span><div class="viewer-stage" id="viewer-stage"><div class="viewer-img"></div></div></div>
    <div class="viewer-pane" data-pane="1" hidden><span class="pane-label" hidden></span><div class="viewer-stage"><div class="viewer-img"></div></div></div>
  </div>
</div>
</body>
</html>
