<title id="uc-02-title">UC-02 update a project&#x27;s status: sequence with bad paths and edge cases</title>
<desc id="uc-02-desc">Sequence of a status update: the Web app posts to the API, which publishes an event that the Aggregator turns into stored status and history. Alt fragments cover an invalid status, an unavailable queue, a duplicate and two simultaneous updates.</desc>
