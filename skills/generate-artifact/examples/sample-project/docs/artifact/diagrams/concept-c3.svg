<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="concept-c3-title concept-c3-desc">
<title id="concept-c3-title">C3 Status history, no overwrite</title>
<desc id="concept-c3-desc">Concept diagram: a status update still refreshes the latest status in the Projects DB and now also appends a row to the status history table.</desc>
<defs><marker id="concept-c3-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5E5D59"/></marker><marker id="concept-c3-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#D97757"/></marker><marker id="concept-c3-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1F6FA8"/></marker></defs>
<rect width="100%" height="100%" fill="#FAF9F5"/>
<text x="24" y="24" fill="#5E5D59" font-size="9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">C3 · STATUS HISTORY</text>
<rect x="352" y="56" width="488" height="152" rx="6" fill="none" stroke="rgba(20,20,19,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="364" y="74" fill="#5E5D59" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.12em">PROJECTS DB</text>
<line x1="150" y1="140" x2="349" y2="140" stroke="#5E5D59" stroke-width="1.2" marker-end="url(#concept-c3-arrow)"/>
<rect x="212" y="119" width="76" height="12" rx="2" fill="#FAF9F5"/><text x="250" y="128" fill="#8A8880" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">STATUS UPDATE</text>
<path d="M520 140 H560" fill="none" stroke="#5E5D59" stroke-width="0"/>
<line x1="560" y1="112" x2="619" y2="112" stroke="#5E5D59" stroke-width="1.2" marker-end="url(#concept-c3-arrow)"/>
<line x1="560" y1="168" x2="619" y2="168" stroke="#D97757" stroke-width="1.2" marker-end="url(#concept-c3-arrow-accent)"/>
<path d="M520 140 H540 V112 H560 M540 140 V168 H560" fill="none" stroke="#5E5D59" stroke-width="1.2"/>
<rect x="569" y="91" width="42" height="12" rx="2" fill="#FAF9F5"/><text x="590" y="100" fill="#8A8880" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT</text>
<rect x="559" y="147" width="62" height="12" rx="2" fill="#FAF9F5"/><text x="590" y="156" fill="#8A8880" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">APPEND ROW</text>
<rect x="40" y="120" width="110" height="40" rx="6" fill="#FAF9F5"/><rect x="40" y="120" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#8A8880" stroke-width="1"/><text x="95.0" y="144.0" fill="#141413" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">Status update</text>
<rect x="364" y="120" width="156" height="40" rx="6" fill="#FAF9F5"/><rect x="364" y="120" width="156" height="40" rx="6" fill="#FBE3B0" stroke="#B87800" stroke-width="1"/><text x="442.0" y="139.0" fill="#5C3A00" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">projects</text><text x="442.0" y="155.0" fill="#5E5D59" font-size="9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">latest status</text>
<rect x="620" y="92" width="200" height="40" rx="6" fill="#FAF9F5"/><rect x="620" y="92" width="200" height="40" rx="6" fill="#EFEDE6" stroke="#B0AEA5" stroke-width="1"/><text x="720.0" y="111.0" fill="#3D3D3A" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">projects.status</text><text x="720.0" y="127.0" fill="#5E5D59" font-size="9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">overwritten as before</text>
<rect x="620" y="148" width="200" height="40" rx="6" fill="#FAF9F5"/><rect x="620" y="148" width="200" height="40" rx="6" fill="#CFE4F5" stroke="#1F6FA8" stroke-width="1"/><text x="720.0" y="167.0" fill="#0B3D63" font-size="12" font-weight="600" font-family="Inter, 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle">status_history</text><text x="720.0" y="183.0" fill="#5E5D59" font-size="9" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="middle">new: one row per update</text>
<text x="40" y="240" fill="#5E5D59" font-size="14" font-family="'Source Serif 4', Georgia, 'Times New Roman', serif" text-anchor="start" font-style="italic">Before, an update overwrote the old value. Now it also adds a history row.</text>
<line x1="24" y1="244" x2="856" y2="244" stroke="rgba(20,20,19,0.10)" stroke-width="0.8"/><text x="24" y="260" fill="#5E5D59" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start" letter-spacing="0.14em">LEGEND</text><rect x="96" y="252" width="16" height="10" rx="2" fill="#FFFFFF" stroke="#8A8880"/><text x="118" y="261" fill="#5E5D59" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">actor</text><rect x="166.8" y="252" width="16" height="10" rx="2" fill="#FBE3B0" stroke="#B87800"/><text x="188.8" y="261" fill="#5E5D59" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">changed</text><rect x="247.52" y="252" width="16" height="10" rx="2" fill="#CFE4F5" stroke="#1F6FA8"/><text x="269.52" y="261" fill="#5E5D59" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">new</text><line x1="308.4" y1="257" x2="332.4" y2="257" stroke="#D97757" stroke-width="1.4"/><text x="338.4" y="261" fill="#5E5D59" font-size="8" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" text-anchor="start">new behavior</text>
</svg>
